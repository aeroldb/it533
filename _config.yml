#
# Site configuration
#

# Name of your site (displayed in the header)
name: IT533 - Network Technology Portfolio

# Name of the author
author: Aeroldb

# Short bio or description
description: My Network Technology Portfolio documenting networking labs, projects, configurations, and troubleshooting experiences.

# Avatar or profile picture
avatar: /images/reverie.png

#
# Optional footer links
#
footer-links:
  dribbble:
  email:
  facebook:
  flickr:
  github: aeroldb
  instagram:
  linkedin:
  pinterest:
  rss: rss
  twitter:
  stackoverflow:
  youtube:
  googleplus:
  playconsole:
  mastodon:

# Disqus comments (leave blank unless configured)
disqus:

# Google Analytics (leave blank unless you have your own tracking ID)
google_analytics:

# Your website URL
url: https://aeroldb.github.io

# Leave blank for a project repository hosted under /it533
enforce_ssl:

# Project repository base URL
baseurl: /it533

#
# Theme configuration
#

permalink: /:title/

version: v1.2.0

kramdown:
  input: GFM
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: "highlight"

sass:
  style: :expanded

plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-paginate

include: ["_pages"]

paginate: 6
paginate_path: /page:num/

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - CNAME
